  intro: >-
    No test campaign was run for this hotfix, and none is claimed here. Because the
    change is confined to recipe metadata, verification is a build check plus a
    sanity check of the affected path on target. Fill in the results below before
    issuing this note.
  tables:
    - heading: "4.1 Test / verification checklist"
      headers: ["Check", "Result"]
      rows:
