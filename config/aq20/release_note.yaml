        - ["diag_cfg package builds and is installed into the image", "REPLACE_ME"]
        - ["diag logging functional on target", "REPLACE_ME"]
        - ["/sdcard resolves to /mnt/sdcard on target, no broken symlink", "REPLACE_ME"]
        - ["Modem / boot / RPM images unchanged vs previous build", "REPLACE_ME"]

known_issues:
  heading: "5. Known Issues"
  points:
    - "This release is scoped to the build failure only. Any functional defects open against the previous build remain open."
    - "The Section 2 descriptions are derived from the commit messages and the directories touched, not from a line-by-line review of the recipe diffs. Confirm the wording against the diffs before publishing externally."
    - "Release version numbering is not yet assigned (see **SDK version** in the header)."
    - "Several Part B images share a commit ID because one commit touched them together: `6d29dedb` is the initial BSP import (BOOT, BTFM, CNSS), and `c6e3a82e` (\"all pyc files removed\") touched RPM and TrustZone in the same commit. This is genuine shared history, not a placeholder."
    - "BOOT, BTFM and CNSS have not been modified since April 2024. If a newer Qualcomm baseline for those images is expected in this product, that is worth checking separately — this note only reports what is in the repo."

