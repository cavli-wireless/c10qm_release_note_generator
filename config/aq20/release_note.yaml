overview:
  intro: >-
    This is a **build hotfix** for the AQ20 Linux 3.18 SDK. The `main` branch could
    not complete a full image build because of two defects in the Yocto recipe layer
    covering the **diag** configuration package. Both are corrected here. There are
    no functional, runtime or firmware changes in this release — the modem, boot
    and RPM images carry over unchanged from the previous build.
  architecture_changes:
    - "None. This release touches only Yocto recipe metadata; no source, kernel or firmware component changed."
  domains:
    - "**Part A — Linux SDK & Build:** the two recipe fixes that restore the image build. See Section 2."
    - "**Part B — Chipcode (Firmware):** no changes in this release. See Section 3."
  appendix_note: "The exact commit range for this release is in **Appendix A**."

part_a:
  heading: "2. Part A — Linux SDK & Build"
  intro: >-
    Both changes are in the Yocto/poky recipe layer. Together they fix the build
    failure that gives the branch its name (`hotfix/failed_to_build_diag`).
  change_table:
    label: "Change set (Cavli commits):"
    headers: ["Commit", "Area", "Change"]
    rows:
      - ["`a45e155`", "Yocto / poky", "Syntax error in SRC_URI for diag_cfg file"]
      - ["`ec1eabf`", "Yocto / poky", "Incorrect path to /sdcard conflict with symlink file to /mnt/sdcard"]
  subsections:
    - heading: "2.1 diag_cfg recipe — SRC_URI syntax error"
      commit_refs: ["a45e155"]
      body:
        - "The `SRC_URI` entry for the **diag_cfg** file was malformed, so the recipe failed to parse and the diag configuration package could not be fetched or built. This aborted the full image build."
        - "The `SRC_URI` declaration is corrected, allowing the diag_cfg package to build again."
    - heading: "2.2 /sdcard path conflict with the /mnt/sdcard symlink"
      commit_refs: ["ec1eabf"]
      body:
        - "A path referencing `/sdcard` conflicted with the `/mnt/sdcard` symlink on the AQ20 rootfs, breaking the build. The path is corrected so the two no longer collide."

part_b:
  heading: "3. Part B — Chipcode (Firmware): Modem, Boot, RPM, TrustZone, BTFM, CNSS"
  intro: >-
    **No changes.** No commit in this release touches any chipcode tree. Each image
    below is listed with the commit that last modified it, so the table doubles as a
    firmware snapshot. The modem sits at **1.1.3** (`bf1c9311`, 28-May-2026); BOOT,
    BTFM and CNSS have not been modified since the initial
    `LE.UM.2.3.6-55700-9x07` import in April 2024.
  change_table:
    label: "Chipcode change set (Cavli commits):"
    headers: ["Commit", "Image", "Change"]
    # Real per-image last-touching commits, read from the repo on 2026-08-21
    # (fetch_local.py --list-subsystems). These are NOT the repo HEAD: each is
    # the most recent commit that actually modified that directory.
    rows:
      - ["`bf1c9311`", "MPSS (modem_proc)", "No change in this release — last touched 2026-05-28 (Update modem version to 1.1.3)"]
      - ["`c6e3a82e`", "TrustZone (trustzone_images)", "No change in this release — last touched 2024-12-03"]
      - ["`c6e3a82e`", "RPM (rpm_proc)", "No change in this release — last touched 2024-12-03"]
      - ["`6d29dedb`", "BOOT (boot_images)", "No change in this release — last touched 2024-04-10 (initial LE.UM.2.3.6-55700-9x07 import)"]
      - ["`6d29dedb`", "BTFM (btfm_proc)", "No change in this release — last touched 2024-04-10 (initial LE.UM.2.3.6-55700-9x07 import)"]
      - ["`6d29dedb`", "CNSS / WLAN (cnss_proc)", "No change in this release — last touched 2024-04-10 (initial LE.UM.2.3.6-55700-9x07 import)"]
      - ["`8c760d9b`", "Common (sectools / signing)", "No change in this release — last touched 2025-08-26"]
  subsections: []

